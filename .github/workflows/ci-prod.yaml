name: Feed API CI/CD (prod) - Build, Push Image, Update Kustomize

on:
  push:
    branches: ["master"]

permissions:
  contents: write
  packages: read

concurrency:
  group: prod-cicd
  cancel-in-progress: true

jobs:
  feed-api-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "temurin"
          cache: gradle

      - name: Build feed-api jar
        run: |
          chmod +x ./gradlew
          ./gradlew clean build --no-daemon
          ls -al apps/api/build/libs

      - name: Set feed-api image metadata
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA}" >> $GITHUB_ENV
          echo "IMAGE_REPO=jhjun07/jifelog-feed-api" >> $GITHUB_ENV

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build feed-api Docker image
        run: |
          docker build \
            -f apps/api/Dockerfile \
            -t ${IMAGE_REPO}:${IMAGE_TAG} \
            -t ${IMAGE_REPO}:latest \
            apps/api

      - name: Push feed-api Docker image
        run: |
          docker push ${IMAGE_REPO}:${IMAGE_TAG}
          docker push ${IMAGE_REPO}:latest

      - name: Update feed-api Kustomize image tag (prod overlay) and push commit
        run: |
          FILE="k8s/overlays/prod/kustomization.yaml"
          sed -i "0,/newTag:/s/newTag:.*/newTag: ${IMAGE_TAG}/" "$FILE"

          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add "$FILE"
          git commit -m "chore: prod deploy ${IMAGE_TAG}" || echo "No changes to commit"
          git push
